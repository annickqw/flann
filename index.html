
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flann — independent graphic design studio, Amsterdam based.">
  <title>Flann — Graphic Design Studio</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" id="favicon" type="image/svg+xml" href="images/vector.svg">

<script src="script.js" defer></script>
<script src="flavicon.js" defer></script>
</head>

<body>

  <!-- HEADER / FLOATING TEXT -->

  <header class="site-header" aria-label="Studio information">

    <h1 class="floating flann"
        data-start-x="50"
        data-start-y="50"
        data-angle="0">
        <img class="flann-line" src="images/vector.svg" alt="">
      Flann
    </h1>

    <p class="floating description"
       data-start-x="21"
       data-start-y="29"
       data-angle="5">
      Independent Graphic Design Studio
    </p>

    <p class="floating location"
       data-start-x="23"
       data-start-y="65"
       data-angle="-9">
      Amsterdam based
    </p>

    <a class="floating instagram"
       data-start-x="75"
       data-start-y="40"
       data-angle="-15"
       href="https://www.instagram.com/"
       target="_blank"
       rel="noopener noreferrer">
      Instagram
    </a>

    <a class="floating mail"
       data-start-x="76"
       data-start-y="72"
       data-angle="8"
       href="mailto:hello@example.com">
      Mail
    </a>

  </header>


  <!-- INTRO -->

  <section class="intro" aria-label="Introduction">

    <a class="see-work" href="#work">
      See Work
      <span aria-hidden="true">↓</span>
    </a>

  </section>


  <!-- PORTFOLIO -->

  <main id="work" aria-label="Selected work">

    <img class="full"
         src="images/project1.png"
         alt="Graphic design work 1"
         decoding="async">

    <img class="small right"
         src="images/project2.png"
         alt="Graphic design work 2"
         loading="lazy"
         decoding="async">

    <img class="medium left"
         src="images/project3.png"
         alt="Graphic design work 3"
         loading="lazy"
         decoding="async">

    <img class="small center"
         src="images/project4.png"
         alt="Graphic design work 4"
         loading="lazy"
         decoding="async">

    <img class="full"
         src="images/project5.png"
         alt="Graphic design work 5"
         loading="lazy"
         decoding="async">

  </main>


  <!-- FOOTER -->

  <footer>
    <span>© Flann 2026</span>
    <a href="mailto:hello@example.com">Get in touch</a>
  </footer>

</body>
</html>
